# Experimental: build the minimal OVMS image natively on a GitHub-hosted ARM64
# runner. Lets us validate the aarch64 build (#2648) without local ARM hardware.
# Expected to be iterative — early runs surface the next arch-specific failure
# (curl paths / S3 SDK) that drive plan steps 2-3.
name: ARM64 build (experimental)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/arm64-docker-build

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      # OpenVINO GenAI nightly publishes arm64 only for ubuntu22 (no ubuntu24 arm64
      # package exists), so the ARM image is built on the ubuntu22 base to match.
      DLDT_PACKAGE_URL: https://storage.openvinotoolkit.org/repositories/openvino_genai/packages/nightly/2026.3.0.0.dev20260624/openvino_genai_ubuntu22_2026.3.0.0.dev20260624_arm64.tar.gz
    steps:
      - name: Confirm native ARM runner
        run: |
          uname -m
          docker version --format 'engine {{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'

      - name: Free up disk space
        run: |
          # Runs 6/7 lost the runner ~85min in (null step conclusions, no artifact) —
          # resource exhaustion during the heavy OpenVINO/TF compile+link. Reclaim as
          # much disk as possible up front.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Add swap (guard against OOM during link)
        run: |
          # Linking OpenVINO/TF objects can exhaust the 16GB RAM; a large swapfile
          # keeps the runner alive through peak memory at the cost of speed.
          sudo fallocate -l 16G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=16384
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      # Buildx with the docker-container driver is required for the GitHub Actions
      # layer cache (type=gha). This lets subsequent runs reuse the unchanged early
      # stages (apt, cpprestsdk, OpenCV, OV download — ~30-40 min) instead of
      # rebuilding from scratch every iteration.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL so `--cache-to type=gha`
      # can read/write the Actions cache from a raw `docker buildx build`.
      - name: Expose GHA cache token
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build minimal ARM64 image
        run: |
          set -o pipefail
          # JOBS=4 = the runner's full core count for fastest compile; the 16G
          # swapfile added above absorbs the peak-RAM spike during linking that
          # OOM-killed the runner in runs 6/7 (which had no swap).
          # BUILDX=buildx + DOCKER_CACHE_OPTION wire in the gha layer cache; the
          # first run populates it, later runs reuse the unchanged early stages.
          make docker_build \
            TARGETARCH=arm64 \
            BASE_OS=ubuntu22 \
            OV_USE_BINARY=1 \
            DLDT_PACKAGE_URL="${DLDT_PACKAGE_URL}" \
            MEDIAPIPE_DISABLE=1 \
            PYTHON_DISABLE=1 \
            RUN_TESTS=0 \
            JOBS=4 \
            BUILDX=buildx \
            DOCKER_CACHE_OPTION="--cache-from type=gha,scope=arm64 --cache-to type=gha,mode=max,scope=arm64" \
            2>&1 | tee arm64-build.log

      - name: Show failure tail
        if: failure()
        run: |
          echo "===== last 200 lines of arm64-build.log ====="
          tail -n 200 arm64-build.log || true
          echo "===== disk/mem at failure ====="
          df -h || true
          free -h || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-log
          path: arm64-build.log
          retention-days: 14
